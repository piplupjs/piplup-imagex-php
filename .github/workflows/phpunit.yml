name: PHPUnit

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run (Unit|Integration|All)'
        required: false
        default: 'Unit'
      php-version:
        description: 'PHP version to use (e.g. 8.0, 8.1, 8.2)'
        required: false
        default: '8.1'

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ github.event.inputs.php-version }}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite "${{ github.event.inputs.suite }}" --colors=always --verbose
